<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>লগইন / নিবন্ধন – সুস্থ হবো</title>
<meta name="theme-color" content="#006a4e">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="site-header"></div>
<div class="auth-wrap">
  <div class="auth-brand">
    <img src="logo.svg" alt="সুস্থ হবো">
    <h1>স্বাগতম! সুস্থ হবো পরিবারে যুক্ত হোন</h1>
    <ul>
      <li><svg class="ic"><use href="#i-drop"/></svg>রক্তদাতা হিসেবে মানুষের জীবন বাঁচান</li>
      <li><svg class="ic"><use href="#i-hand"/></svg>জরুরি রক্ত ও চিকিৎসা সহযোগিতার অনুরোধ করুন</li>
      <li><svg class="ic"><use href="#i-stetho"/></svg>সঠিক ডাক্তার ও হাসপাতাল খুঁজুন</li>
    </ul>
  </div>
  <div class="auth-pane">
    <div class="auth-card">
      <div id="loggedIn" style="display:none;text-align:center">
        <div class="big-user"><svg class="ic"><use href="#i-user"/></svg></div><h2 id="lname"></h2><p class="small" id="lphone" style="margin-bottom:16px"></p>
        <a href="index.html" class="btn btn-g btn-block" style="margin-bottom:10px"><svg class="ic"><use href="#i-home"/></svg> হোমে যান</a>
        <button class="btn btn-o btn-block" onclick="Auth.out()"><svg class="ic"><use href="#i-logout"/></svg> লগআউট</button>
      </div>

      <div id="forms">
        <div class="atabs"><button class="on" data-p="login">লগইন</button><button data-p="signup">নতুন একাউন্ট</button></div>
        <div class="msg" id="msg"></div>

        <!-- লগইন -->
        <form class="pane on" id="login">
          <div class="field"><label>ইমেইল</label><input name="ident" type="email" placeholder="আপনার ইমেইল" required autocomplete="username"></div>
          <div class="field"><label>পাসওয়ার্ড</label><div class="pw"><input name="pass" type="password" required autocomplete="current-password"><button type="button" class="eye" aria-label="পাসওয়ার্ড দেখান/লুকান"><svg class="ic"><use href="#i-eye"/></svg></button></div></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:16px"><span class="small" style="display:flex;gap:6px;align-items:center"><svg class="ic"><use href="#i-lock"/></svg> নিরাপদ লগইন</span><button type="button" class="link" data-go="forgot">পাসওয়ার্ড ভুলে গেছেন?</button></div>
          <button class="btn btn-g btn-block">লগইন করুন</button>
          <p class="small" style="text-align:center;margin-top:14px">একাউন্ট নেই? <button type="button" class="link" data-go="signup">নতুন একাউন্ট খুলুন</button></p>
        </form>

        <!-- রেজিস্ট্রেশন -->
        <form class="pane" id="signup">
          <label>আপনি কে?</label>
          <div class="rolep">
            <label><input type="radio" name="role" value="রোগী" checked><span><svg class="ic"><use href="#i-smile"/></svg>রোগী</span></label>
            <label><input type="radio" name="role" value="রক্তদাতা"><span><svg class="ic"><use href="#i-drop"/></svg>রক্তদাতা</span></label>
            <label><input type="radio" name="role" value="ডাক্তার"><span><svg class="ic"><use href="#i-stetho"/></svg>ডাক্তার</span></label>
            <label><input type="radio" name="role" value="স্বেচ্ছাসেবী"><span><svg class="ic"><use href="#i-hand"/></svg>স্বেচ্ছাসেবী</span></label>
          </div>
          <div class="field"><label>পুরো নাম *</label><input name="name" required></div>
          <div class="row2"><div class="field"><label>মোবাইল *</label><input name="phone" required inputmode="numeric" placeholder="01XXXXXXXXX"></div>
          <div class="field"><label>ইমেইল *</label><input name="email" type="email" required placeholder="ভেরিফিকেশন লিংক যাবে"></div></div>
          <div class="field"><label>আগে কি রক্ত দিয়েছেন? *</label>
  <div class="yn"><label><input type="radio" name="donated" value="হ্যাঁ" required>হ্যাঁ</label><label><input type="radio" name="donated" value="না">না</label></div></div>
<div class="field" id="lastWrap" style="display:none"><label>শেষ কবে রক্ত দিয়েছেন? *</label><input type="date" name="lastDonation" id="lastDon"></div>
          <div class="field" id="bgWrap" style="display:none"><label>রক্তের গ্রুপ *</label><select name="blood" id="bgSel"></select></div>
          <div class="row2"><div class="field"><label>বিভাগ</label><select name="division" id="rdv"></select></div><div class="field"><label>জেলা</label><select name="district" id="rdi"></select></div></div>
          <div class="field"><label>উপজেলা</label><select name="upazila" id="rup"></select></div>
          <div class="field"><label>পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)</label><div class="pw"><input name="pass" id="rpass" type="password" required minlength="6" autocomplete="new-password"><button type="button" class="eye" aria-label="পাসওয়ার্ড দেখান/লুকান"><svg class="ic"><use href="#i-eye"/></svg></button></div><div class="meter"><i id="meter"></i></div></div>
          <div class="field"><label>পাসওয়ার্ড আবার দিন *</label><input name="pass2" type="password" required></div>
          <label class="terms"><input type="checkbox" required> আমি শর্তাবলী মেনে নিচ্ছি। রক্তদাতা হলে আমার নাম, এলাকা ও রক্তের গ্রুপ লগইন করা ব্যবহারকারীরা দেখতে পারবেন; মোবাইল নম্বর শুধু কেউ "নম্বর দেখুন" চাপলে দেখাবে এবং তা লগ হবে।</label>
          <button class="btn btn-r btn-block">একাউন্ট খুলুন</button>
        </form>

        <!-- পাসওয়ার্ড রিসেট -->
        <div class="pane" id="forgot">
          <form id="f1">
            <p class="small" style="margin-bottom:12px">রেজিস্ট্রেশনের ইমেইল দিন। আমরা পাসওয়ার্ড বদলানোর একটি লিংক পাঠাব।</p>
            <div class="field"><label>ইমেইল</label><input name="email" type="email" required></div>
            <button class="btn btn-g btn-block">লিংক পাঠান</button>
            <p class="small" style="text-align:center;margin-top:14px"><button type="button" class="link" data-go="login">← লগইনে ফিরে যান</button></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="site-footer"></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="data.js"></script><script src="app.js"></script><script src="login.js"></script>
</body></html>
